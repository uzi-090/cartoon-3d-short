name: Validate skill and starter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/project/package-lock.json
      - run: node scripts/validate-package.mjs
      - run: npm ci --ignore-scripts
        working-directory: templates/project
      - run: npm run check
        working-directory: templates/project
